# .deb and .rpm for scribe (plan phase 13), built by scripts/build/linux-packages.sh with nfpm.
# The same layout as scripts/install/linux.sh, with the files where packages put them
# (/usr/lib/systemd, /usr/lib/tmpfiles.d). The build script fills in these variables (nfpm
# itself doesn't expand them in file paths):
#   SCRIBE_VERSION  the version the binaries report (0.3.0-alpha.2, 0.3.0+3.gabc1234)
#   PKG_ARCH        amd64 or arm64
#   BINS            the folder with scribed and scribe
#   STAGE           the folder with the files the build script prepares (scribe.toml)
name: scribe
version: ${SCRIBE_VERSION}
version_schema: semver
arch: ${PKG_ARCH}
platform: linux
section: net
priority: optional
maintainer: Alex Savatieiev
description: |
  Tracker of outgoing connections.
  scribed records which process connected where (eBPF, with libpcap as a fallback), learns a
  baseline and alerts on new destinations; `scribe` reads and controls it.
vendor: scribe
homepage: https://github.com/savex/scribe
license: MIT OR Apache-2.0

overrides:
  deb:
    depends:
      - libelf1t64 | libelf1
      - zlib1g
    recommends:
      # The pcap fallback (kernels without eBPF support) loads it at run time.
      - libpcap0.8t64 | libpcap0.8
  rpm:
    depends:
      - elfutils-libelf
      - zlib
    recommends:
      - libpcap

contents:
  - src: ${BINS}/scribed
    dst: /usr/bin/scribed
    file_info: { mode: 0755 }
  - src: ${BINS}/scribe
    dst: /usr/bin/scribe
    file_info: { mode: 0755 }

  - src: packaging/linux/scribed.service
    dst: /usr/lib/systemd/system/scribed.service
    file_info: { mode: 0644 }
  - src: packaging/linux/scribe-notify.service
    dst: /usr/lib/systemd/user/scribe-notify.service
    file_info: { mode: 0644 }
  - src: packaging/linux/scribe.tmpfiles
    dst: /usr/lib/tmpfiles.d/scribe.conf
    file_info: { mode: 0644 }

  - dst: /etc/scribe
    type: dir
    file_info: { mode: 0755 }
  # Readable by scribed after it left root, not writable by anyone else; kept across upgrades and
  # on remove (deb: removed on purge).
  - src: ${STAGE}/scribe.toml
    dst: /etc/scribe/scribe.toml
    type: config|noreplace
    file_info: { mode: 0640, owner: root, group: scribe }

  - src: readme.md
    dst: /usr/share/doc/scribe/readme.md
    file_info: { mode: 0644 }
  - src: packaging/README.md
    dst: /usr/share/doc/scribe/packaging.md
    file_info: { mode: 0644 }
  - src: LICENSE-MIT
    dst: /usr/share/doc/scribe/LICENSE-MIT
    file_info: { mode: 0644 }
  - src: LICENSE-APACHE
    dst: /usr/share/doc/scribe/LICENSE-APACHE
    file_info: { mode: 0644 }

scripts:
  preinstall: packaging/linux/scripts/preinstall.sh
  postinstall: packaging/linux/scripts/postinstall.sh
  preremove: packaging/linux/scripts/preremove.sh
  postremove: packaging/linux/scripts/postremove.sh
