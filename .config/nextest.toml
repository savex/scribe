# cargo-nextest settings for the fast run (workfiles/test-list.md).
# Each test runs in its own process; tags are the module a test sits in:
#   cargo nextest run --workspace --all-features -E 'test(/(^|::)smoke::/)'

[profile.default]
# Functional and smoke tests: warn at 2 s, kill at 6 s.
slow-timeout = { period = "2s", terminate-after = 3 }
fail-fast = false
status-level = "slow"
final-status-level = "slow"

[[profile.default.overrides]]
# Integration and scenario tests: warn at 5 s, kill at 10 s.
filter = 'test(/(^|::)(integration|scenario)::/)'
slow-timeout = { period = "5s", terminate-after = 2 }

[profile.ci]
fail-fast = false
slow-timeout = { period = "2s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'test(/(^|::)(integration|scenario)::/)'
slow-timeout = { period = "5s", terminate-after = 2 }

[profile.ci.junit]
path = "junit.xml"
