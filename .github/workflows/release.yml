# Automatic: builds and publishes a GitHub Release for every pushed version tag.
# Also dispatched by "Bump version" (pushes made with GITHUB_TOKEN don't trigger tag events),
# and can be re-run by hand for an existing tag.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Check tag, Cargo.toml and branch
        id: version
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::tag $TAG not found"; exit 1; }
          version=${TAG#v}
          scripts/version.sh validate "$version"
          scripts/version.sh check "$TAG"
          git fetch --quiet origin main
          git merge-base --is-ancestor "$TAG^{commit}" origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ $version == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --all-features --locked

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, smoke: true }
          - { os: macos-latest, target: aarch64-apple-darwin, smoke: true }
          - { os: macos-latest, target: x86_64-apple-darwin, smoke: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, smoke: true }
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SCRIBE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p scribe-daemon -p scribe-cli

      - name: Package
        shell: bash
        run: |
          name="scribe-$VERSION-${{ matrix.target }}"
          exe=""; [[ "${{ matrix.target }}" == *windows* ]] && exe=".exe"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/scribed$exe" "target/${{ matrix.target }}/release/scribe$exe" "dist/$name/"
          cp readme.md config/scribe.toml "dist/$name/"
          # Service files for this system (packaging/README.md).
          mkdir -p "dist/$name/service"
          cp packaging/README.md "dist/$name/service/"
          case "${{ matrix.target }}" in
            *linux*) cp packaging/linux/scribed.service packaging/linux/scribe-notify.service "dist/$name/service/" ;;
            *apple*) cp packaging/macos/io.github.savex.scribed.plist packaging/macos/io.github.savex.scribe-notify.plist "dist/$name/service/" ;;
            *windows*) cp packaging/windows/install-service.ps1 packaging/windows/install-notify.ps1 "dist/$name/" ;;
          esac
          if [[ "${{ matrix.smoke }}" == "true" ]]; then
            got=$("dist/$name/scribe$exe" --version)
            [[ "$got" == "scribe $VERSION" ]] || { echo "::error::binary reports '$got', expected 'scribe $VERSION'"; exit 1; }
            got=$("dist/$name/scribed$exe" --version)
            [[ "$got" == "scribed $VERSION" ]] || { echo "::error::daemon reports '$got', expected 'scribed $VERSION'"; exit 1; }
            effective=$("dist/$name/scribed$exe" --check-config --config "dist/$name/scribe.toml") \
              || { echo "::error::scribed rejects the shipped config"; exit 1; }
            grep -q '^\[modules.url\]' <<<"$effective" \
              || { echo "::error::the URL module is missing from the effective config"; exit 1; }
          fi
          cd dist
          if [[ -n "$exe" ]]; then 7z a -tzip "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"

      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create or update release
        run: |
          flags=()
          [[ "${{ needs.verify.outputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "scribe $VERSION" --generate-notes "${flags[@]}"
          fi
          echo "### Released scribe $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
