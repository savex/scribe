# Manual: privileged sensor conformance (test-approach section 5.2). Test binaries are built
# as the runner user and only executed with root / admin rights.
name: Sensor tests

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Operating systems"
        type: choice
        options: [all, ubuntu, macos, windows]
        default: all

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sensors:
    name: Sensors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || format('["{0}-latest"]', inputs.os)) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build tools and capture libraries (Linux)
        uses: ./.github/actions/linux-build-deps
        with:
          extra: libpcap-dev
      # TODO(windows): install Npcap silently (needs the Npcap OEM installer) for the pcap sensor.

      - name: Traffic generator (no privileges)
        run: "cargo test -p scribe-sensor-conformance --test functional --locked -- traffic_generator::"

      - name: Build privileged tests
        id: build
        shell: bash
        run: |
          bin=$(cargo test -p scribe-sensor-conformance --test functional --no-run --locked --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "functional" and .executable != null) | .executable')
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            daemon=$(cargo test -p scribe-daemon --test functional --no-run --locked --message-format=json \
              | jq -r 'select(.reason == "compiler-artifact" and .target.name == "functional" and .executable != null) | .executable')
            echo "daemon=$daemon" >> "$GITHUB_OUTPUT"
          fi

      - name: Run privileged tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # The runner is already an administrator. Npcap isn't installed on hosted runners (its
            # silent installer needs the OEM edition): the pcap test runs only where it is.
            "${{ steps.build.outputs.bin }}" --ignored --exact sensors::etw_sensor_conforms
            if [[ -f /c/Windows/System32/Npcap/wpcap.dll ]]; then
              "${{ steps.build.outputs.bin }}" --ignored --exact sensors::pcap_sensor_conforms
            else
              echo "::warning::Npcap is not installed: pcap_sensor_conforms skipped"
            fi
          else
            sudo "${{ steps.build.outputs.bin }}" --ignored sensors::
          fi

      - name: Service as NT SERVICE\scribed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p scribe-daemon -p scribe-cli --locked
          scripts/ci/windows-service-check.ps1 -Bin (Resolve-Path target/debug).Path

      - name: Install scripts (scripts/install)
        # Install from a debug build, read the status as a scribe group member, upgrade, purge.
        shell: bash
        run: |
          cargo build -p scribe-daemon -p scribe-cli --locked
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pwsh -NoProfile -File scripts/ci/install-check.ps1 -Bin "$(cygpath -w "$PWD/target/debug")"
          else
            scripts/ci/install-check.sh target/debug
          fi

      - name: Linux packages (.deb on the runner, .rpm in Fedora)
        # Build both with nfpm from the debug build; install, upgrade and purge the .deb with
        # systemd; install and remove the .rpm in a container.
        if: runner.os == 'Linux'
        run: scripts/ci/package-check.sh target/debug

      - name: Capture after dropping root (Linux)
        if: runner.os == 'Linux'
        # Alone in its process: the test drops the privileges of the whole test binary.
        run: sudo "${{ steps.build.outputs.daemon }}" --ignored --exact service::privileges_keeper_restarts_capture_as_a_user

  # The eBPF sensor on each kernel of the matrix: virtme-ng boots an Ubuntu mainline build under KVM
  # with the runner's filesystem as a copy-on-write root, so the test binaries built here run as root
  # in the guest (scripts/ci/kernel-check.sh). 5.8 is the oldest supported on x86_64.
  kernels:
    name: eBPF on Linux ${{ matrix.kernel }}
    if: inputs.os == 'all' || inputs.os == 'ubuntu'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kernel: [v5.8, v5.15, v6.1, v6.18]
        include:
          # 5.8 finds no virtiofs root (virtme-ng's default): host root over 9p. psi=0: 5.8.0 oopses in
          # psi_trigger_create when today's systemd-udevd writes a cgroup pressure file.
          - kernel: v5.8
            vng: --force-9p --append psi=0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build tools, capture libraries and the VM runner
        uses: ./.github/actions/linux-build-deps
        with:
          extra: libpcap-dev qemu-system-x86 busybox-static virtiofsd kmod zstd

      - name: KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: virtme-ng
        run: pipx install virtme-ng==1.42

      - name: Build privileged tests
        id: build
        run: |
          artifact() {
            cargo test -p "$1" --test functional --no-run --locked --message-format=json \
              | jq -r 'select(.reason == "compiler-artifact" and .target.name == "functional" and .executable != null) | .executable'
          }
          echo "conformance=$(artifact scribe-sensor-conformance)" >> "$GITHUB_OUTPUT"
          echo "daemon=$(artifact scribe-daemon)" >> "$GITHUB_OUTPUT"

      - name: Sensor tests on ${{ matrix.kernel }}
        run: |
          # -v shows the guest's boot console; a guest that hangs is stopped after 10 minutes.
          # A standard PC machine: on QEMU's default microvm, 5.15 and 6.18 hung at ACPI set-up.
          timeout --kill-after 30s 10m \
            vng -v -r "${{ matrix.kernel }}" --disable-microvm ${{ matrix.vng }} \
              --user root --network user --cpus 2 -m 2G -- \
            "$GITHUB_WORKSPACE/scripts/ci/kernel-check.sh" \
            "${{ steps.build.outputs.conformance }}" "${{ steps.build.outputs.daemon }}"

  # TODO: macOS Network Extension needs a self-hosted Mac with the MDM approval profile.
