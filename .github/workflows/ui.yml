# Manual: UI tests against the mock API (test-approach section 4).
# Skips with a notice until the Tauri app exists in ui/.
name: UI tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check for UI project
        id: detect
        run: |
          if [[ -f package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ui/package.json not found; UI is not implemented yet, skipping."
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Component tests (Vitest)
        if: steps.detect.outputs.present == 'true'
        run: |
          npm ci
          npx vitest run tests/components

      - name: Screen flows and screenshots (Playwright, mock API)
        if: steps.detect.outputs.present == 'true'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e tests/visual

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure() && steps.detect.outputs.present == 'true'
        with:
          name: playwright-report
          path: ui/playwright-report
