# Example scribed configuration (config loading is not implemented yet).

mode = "learn"            # learn | caution | alert
profile = "default"       # baseline (known hosts list) to use

[storage.state]
kind = "sqlite"
path = "/var/lib/scribe/state.db"

[[storage.sinks]]
name = "local-history"
kind = "sqlite"
path = "/var/lib/scribe/events.db"
retention = "30d"

# Requires building with `--features postgres`.
# [[storage.sinks]]
# name = "central"
# kind = "postgres"
