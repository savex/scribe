# cargo-fuzz targets. Separate workspace: needs nightly and libFuzzer, so the main build never touches it.
#   cargo install cargo-fuzz
#   cargo +nightly fuzz run tls_client_hello -- -max_total_time=1800
[package]
name = "scribe-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
scribe-enrich = { path = "../crates/enrich" }
scribe-module-url = { path = "../crates/module-url" }

[workspace]
members = ["."]

[[bin]]
name = "tls_client_hello"
path = "fuzz_targets/tls_client_hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_message"
path = "fuzz_targets/dns_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quic_initial"
path = "fuzz_targets/quic_initial.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_request"
path = "fuzz_targets/http_request.rs"
test = false
doc = false
bench = false
