name: counters-exact
description: Connection, request and byte counters are exact per host, including interleaved flows to the same host.
mode: learn
profile: default
baseline: []

events:
  - { at: 0s, dst: "192.0.2.20:80",  host: plain.example.com, security: plaintext, bytes: 100 }
  - { at: 0s, dst: "192.0.2.20:80",  host: plain.example.com, kind: request, url: "http://plain.example.com/a", bytes: 50 }
  - { at: 1s, dst: "192.0.2.10:443", host: api.example.com,   security: tls, bytes: 512 }
  - { at: 1s, dst: "192.0.2.20:80",  host: plain.example.com, kind: request, url: "http://plain.example.com/b", bytes: 50 }
  - { at: 2s, dst: "192.0.2.10:443", host: api.example.com,   security: tls, bytes: 1024 }
  - { at: 3s, dst: "192.0.2.20:80",  host: plain.example.com, kind: close }

expect:
  alerts: []
  hosts:
    plain.example.com: { connections: 1, requests: 2, bytes: 200, tls_seen: false, plaintext_seen: true }
    api.example.com:   { connections: 2, requests: 0, bytes: 1536, tls_seen: true, plaintext_seen: false }
