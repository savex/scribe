name: caution-ordinary-new-host
description: In caution mode a new host that looks ordinary (DNS name, TLS, port 443, known process) raises no alert.
mode: caution
profile: default
baseline:
  - api.example.com

events:
  - { at: 0s, dst: "192.0.2.12:443", host: docs.example.com, security: tls, process: /usr/bin/curl, pid: 100 }

expect:
  alerts: []
  hosts:
    docs.example.com: { connections: 1, tls_seen: true, plaintext_seen: false }
