name: hostname-unresolved
description: Flows whose hostname is hidden (ECH outer name only, DNS over HTTPS) are tracked and flagged as unresolved, not dropped.
mode: alert
profile: default
baseline:
  - public.example.com
  - doh.example.net

events:
  - { at: 0s, dst: "198.51.100.53:443", host: doh.example.net,    security: tls }
  - { at: 1s, dst: "192.0.2.12:443",    host: public.example.com, security: tls, ech: true }
  - { at: 2s, dst: "192.0.2.60:443",    security: tls }

expect:
  alerts:
    - { host: null, dst: "192.0.2.60:443", reason: unlisted_host }
  hosts:
    doh.example.net:    { connections: 1, unresolved: false }
    public.example.com: { connections: 1, unresolved: true }
    192.0.2.60:         { connections: 1, tls_seen: true, unresolved: true }
