name: caution-unusual-port-new-process
description: In caution mode an unusual port (30) from a process never seen before (25) scores at least 55 (plus 20 for a first-seen TLD) and alerts, named after the highest-scoring signal.
mode: caution
profile: default
baseline: []

events:
  - { at: 0s, dst: "192.0.2.13:8080", host: tools.example.com, security: tls, process: /opt/tool/bin/sync, pid: 400 }

expect:
  alerts:
    - { host: tools.example.com, dst: "192.0.2.13:8080", process: /opt/tool/bin/sync, reason: unusual_port }
