name: mode-switch-via-api
description: Switching from learn to alert through the local API takes effect for the next event, and hosts learned before the switch stay quiet.
mode: learn
profile: default
baseline: []

events:
  - { at: 0s, dst: "192.0.2.10:443", host: api.example.com, security: tls }
  - { at: 1m, api: { set_mode: alert } }
  - { at: 2m, dst: "192.0.2.10:443", host: api.example.com,  security: tls }
  - { at: 3m, dst: "192.0.2.12:443", host: docs.example.com, security: tls }

expect:
  mode: alert
  baseline_added:
    - api.example.com
  alerts:
    - { host: docs.example.com, dst: "192.0.2.12:443", reason: unlisted_host }
