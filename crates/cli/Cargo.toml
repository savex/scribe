[package]
name = "scribe-cli"
description = "Command line client for the scribe daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "scribe"
path = "src/main.rs"

[features]
default = ["url"]
# Module subcommands (specs 7.4.5): `scribe url …`.
url = ["dep:scribe-module-url"]

[dependencies]
scribe-core.workspace = true
scribe-api = { workspace = true, features = ["client"] }
clap.workspace = true
tokio = { workspace = true, features = ["rt", "time", "signal", "macros"] }
tokio-stream.workspace = true
tonic.workspace = true
serde.workspace = true
serde_json.workspace = true
scribe-module-url = { workspace = true, features = ["client"], optional = true }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
