[package]
name = "scribe-storage-manager"
description = "Backend registry, write batching, fan-out to sinks, spool and retention"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:scribe-storage-sqlite"]
postgres = ["dep:scribe-storage-postgres"]

[dependencies]
scribe-storage-api.workspace = true
scribe-storage-sqlite = { workspace = true, optional = true }
scribe-storage-postgres = { workspace = true, optional = true }

[dev-dependencies]
scribe-storage-conformance.workspace = true
scribe-test-support.workspace = true
scribe-core.workspace = true
serde_json.workspace = true
