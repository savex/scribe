[package]
name = "scribe-process"
description = "Process attribution from the OS socket tables (Linux /proc, macOS libproc, Windows IP Helper) for sensors without it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
scribe-core.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading"] }

[dev-dependencies]
scribe-test-support.workspace = true

[[test]]
name = "functional"
path = "tests/functional/main.rs"
