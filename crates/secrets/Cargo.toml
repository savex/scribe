[package]
name = "scribe-secrets"
description = "Secret references (file:, keychain:, dpapi:, secret-service:) and key generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
ring.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "functional"
path = "tests/functional/main.rs"
