[package]
name = "scribe-daemon"
description = "Background service: capture, enrichment, policy engine, storage, local API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "scribed"
path = "src/main.rs"

[features]
default = ["sqlite", "url"]
sqlite = ["scribe-storage-manager/sqlite"]
postgres = ["scribe-storage-manager/postgres"]
# Modules (specs 7.4); `url` is on by default.
url = ["dep:scribe-module-url", "scribe-module-url/server"]

[dependencies]
scribe-core.workspace = true
scribe-enrich.workspace = true
scribe-policy.workspace = true
scribe-alerts = { workspace = true, features = ["webhook"] }
scribe-net.workspace = true
minisign-verify.workspace = true
scribe-secrets.workspace = true
ring.workspace = true
scribe-storage-api.workspace = true
scribe-storage-manager.workspace = true
scribe-module-api.workspace = true
scribe-api = { workspace = true, features = ["server"] }
tonic.workspace = true
tonic-health.workspace = true
tokio-stream.workspace = true
serde_json.workspace = true
scribe-module-url = { workspace = true, optional = true }
scribe-sensor-pcap.workspace = true
scribe-process.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "macros", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
scribe-sensor-linux.workspace = true
tracing-journald.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tracing-oslog.workspace = true

[target.'cfg(windows)'.dependencies]
scribe-sensor-windows.workspace = true
windows-service = "0.8"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
scribe-module-url.workspace = true
scribe-test-support.workspace = true
tempfile.workspace = true
