[package]
name = "scribe-daemon"
description = "Background service: capture, enrichment, policy engine, storage, local API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "scribed"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["scribe-storage-manager/sqlite"]
postgres = ["scribe-storage-manager/postgres"]

[dependencies]
scribe-core.workspace = true
scribe-enrich.workspace = true
scribe-storage-api.workspace = true
scribe-storage-manager.workspace = true
scribe-sensor-pcap.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
scribe-sensor-linux.workspace = true
tracing-journald.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tracing-oslog.workspace = true

[target.'cfg(windows)'.dependencies]
scribe-sensor-windows.workspace = true

[dev-dependencies]
tempfile.workspace = true
