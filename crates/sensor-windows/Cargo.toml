[package]
name = "scribe-sensor-windows"
description = "Windows sensor: ETW Kernel-Network and DNS-Client events joined with Npcap packets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
scribe-core.workspace = true
scribe-process.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
scribe-sensor-pcap.workspace = true
tracing.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_Etw", "Win32_System_Time"] }

[dev-dependencies]
scribe-enrich.workspace = true
scribe-sensor-pcap.workspace = true
scribe-test-support.workspace = true
serde.workspace = true
serde_json.workspace = true

[[test]]
name = "functional"
path = "tests/functional/main.rs"
