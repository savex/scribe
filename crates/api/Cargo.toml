[package]
name = "scribe-api"
description = "Local gRPC API between scribed and its clients: protocol, transport, caller identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
# The daemon side: generated service trait, socket listener, caller identity and access checks.
server = ["tonic/server", "tonic/router", "tokio/net", "tokio-stream/net"]
# The client side: generated client and the socket connector.
client = ["tonic/channel", "tokio/net", "dep:hyper-util", "dep:tower"]

[dependencies]
scribe-core.workspace = true
tonic = { workspace = true, features = ["codegen"] }
tonic-prost.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
tokio-stream.workspace = true
hyper-util = { workspace = true, features = ["tokio"], optional = true }
tower = { workspace = true, features = ["util"], optional = true }
thiserror.workspace = true
serde.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
scribe-api = { path = ".", features = ["server", "client"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tempfile.workspace = true
tonic.workspace = true
tokio-stream.workspace = true
libc.workspace = true

[[test]]
name = "functional"
path = "tests/functional/main.rs"
