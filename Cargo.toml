[workspace]
resolver = "2"
members = ["crates/*", "tests"]

[workspace.package]
version = "0.3.0-alpha.2"
edition = "2021"
rust-version = "1.89"
# Nothing is published to crates.io: releases ship binaries (deny.toml treats the crates as private).
publish = false

[workspace.dependencies]
scribe-core = { path = "crates/core" }
scribe-enrich = { path = "crates/enrich" }
scribe-storage-api = { path = "crates/storage-api" }
scribe-storage-manager = { path = "crates/storage-manager", default-features = false }
scribe-storage-sqlite = { path = "crates/storage-sqlite" }
scribe-storage-postgres = { path = "crates/storage-postgres" }
scribe-storage-conformance = { path = "crates/storage-conformance" }
scribe-sensor-conformance = { path = "crates/sensor-conformance" }
scribe-test-support = { path = "crates/test-support" }
scribe-sensor-linux = { path = "crates/sensor-linux" }
scribe-sensor-windows = { path = "crates/sensor-windows" }
scribe-sensor-pcap = { path = "crates/sensor-pcap" }
scribe-module-api = { path = "crates/module-api" }
scribe-module-conformance = { path = "crates/module-conformance" }
scribe-module-url = { path = "crates/module-url" }
scribe-daemon = { path = "crates/daemon" }
scribe-cli = { path = "crates/cli" }
scribe-secrets = { path = "crates/secrets" }
scribe-policy = { path = "crates/policy" }
scribe-api = { path = "crates/api" }
scribe-alerts = { path = "crates/alerts" }
scribe-net = { path = "crates/net" }
scribe-process = { path = "crates/process" }

# Third-party. Keep versions compatible with `rust-version` (policy: follow dependencies).
tokio = { version = "1.54", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.43", features = ["bundled"] }
toml = "1.2"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
tracing-journald = "0.3"
tracing-oslog = "0.3"
fs4 = "1.1"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
proptest = "1.11"
tempfile = "3"
ring = "0.17"
# libpcap / Npcap, loaded at run time by the pcap sensor.
libloading = "0.9"
# Local API (phase 10): gRPC over a Unix socket / named pipe. `protox` compiles the .proto files in
# Rust, so building needs no `protoc`.
tonic = { version = "0.14.9", default-features = false }
tonic-prost = "0.14.9"
tonic-prost-build = { version = "0.14.9", default-features = false }
tonic-health = { version = "0.14.9", default-features = false }
prost = "0.14"
protox = "0.10"
tokio-stream = { version = "0.1.19", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
tower = { version = "0.5", default-features = false }
# Outgoing HTTPS (`scribe-net`): rustls with ring (already used for QUIC), the OS certificate
# verifier, a small HTTP/1.1 client of our own for the webhook and threat-list rules.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
http = "1.5"
httparse = "1.10"
# OS secret stores (`scribe-secrets`): macOS keychain, Linux Secret Service (pure-Rust D-Bus, the
# same zbus as notify-rust, secrets encrypted on the bus with pure-Rust AES); Windows DPAPI through
# windows-sys.
security-framework = "3.7"
secret-service = { version = "6", default-features = false, features = ["rt-default", "crypto-rust"] }
# Signed threat lists (`[[policy.threat_lists]] minisign_key`); no dependencies of its own.
minisign-verify = "0.3"
# Postgres backend (phase 12): async client on the backend's own worker runtime, TLS through
# rustls with scribe-net's verifier (no OpenSSL).
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime", "with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", default-features = false }
# Linux eBPF sensor (plan option 7B): libbpf vendored and linked statically; libelf and zlib from
# the system.
libbpf-rs = "0.27"
libbpf-cargo = "0.27"
# Test certificates for the HTTPS tests.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Desktop notifications for `scribe notify` (D-Bus in pure Rust on Linux, Notification Center on
# macOS, toasts on Windows). Needs Rust 1.89.
notify-rust = { version = "4.19", default-features = false, features = ["z"] }
# Scenario files (tests only); maintained fork of the deprecated serde_yaml.
serde_yaml_ng = "0.10"
